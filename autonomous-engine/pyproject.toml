[project]
name = "autonomous-engine"
version = "0.7.0"
description = "Autonomous Software Engineering Runtime: a persistent, deterministic orchestration core that coordinates AI agents to turn a project goal into a verified software project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Autonomous Engineering" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
auto = "autonomous_engine.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    # Public exception names are part of the API (PermissionDenied,
    # IllegalTransition, EndpointNotAllowed, BudgetExceeded); renaming
    # them would break every caller for no behavioural gain.
    "N818",
]
