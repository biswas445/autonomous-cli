[project]
name = "autonomous-engine"
version = "0.8.0"
description = "Autonomous Software Engineering Runtime: a persistent, deterministic orchestration core that coordinates AI agents to turn a project goal into a verified software project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Autonomous Engineering" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
auto = "autonomous_engine.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    # Public exception names are part of the API (PermissionDenied,
    # IllegalTransition, EndpointNotAllowed, BudgetExceeded); renaming
    # them would break every caller for no behavioural gain.
    "N818",
]

[tool.coverage.run]
source = ["src/autonomous_engine"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
# Practical baseline (#7): check every definition body, but do not require
# annotations everywhere yet — the codebase is migrating incrementally.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
# Mixins share the Orchestrator host's attributes by design; mypy cannot see
# the composed class. Every other attr-defined error is a real signal.
module = [
    "autonomous_engine.runtime.orchestrator_lifecycle",
    "autonomous_engine.runtime.orchestrator_quality",
]
disable_error_code = ["attr-defined"]
